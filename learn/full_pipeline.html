<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大模型全流程 - MiniMind 学习</title>
    <link rel="stylesheet" href="styles/common.css">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: rgba(20, 20, 35, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(180deg, var(--bg-main) 0%, #101020 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-title {
            text-align: center;
            padding: 20px 0 15px;
        }

        .page-title h1 {
            font-size: 2em;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-title p {
            color: #666;
            margin-top: 8px;
        }

        /* 模式选择 */
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-tab {
            padding: 10px 18px;
            background: transparent;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: #888;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mode-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: #000;
            font-weight: 600;
        }

        /* 可视化区域 */
        .viz-panel {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        /* 流程容器 */
        .flow-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* 步骤行 */
        .step-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            padding: 8px 0;
        }

        /* 步骤块 */
        .step-box {
            background: rgba(30, 30, 50, 0.95);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            min-width: 120px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .step-box:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .step-box.active {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            animation: pulse-box 1.5s infinite;
        }

        .step-box.completed {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        @keyframes pulse-box {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 0 35px rgba(0, 212, 255, 0.5); }
        }

        .step-box .icon {
            font-size: 1.6em;
            margin-bottom: 4px;
        }

        .step-box .name {
            font-weight: 600;
            font-size: 0.85em;
            color: #fff;
            margin-bottom: 3px;
        }

        .step-box .dim {
            font-size: 0.7em;
            color: var(--primary);
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        /* 箭头 */
        .arrow-down {
            width: 2px;
            height: 30px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(255,255,255,0.4));
            position: relative;
            margin: 3px auto;
        }

        .arrow-down::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 7px solid rgba(255,255,255,0.4);
        }

        .arrow-down.active {
            background: linear-gradient(to bottom, rgba(0, 212, 255, 0.3), var(--primary));
        }

        .arrow-down.active::after {
            border-top-color: var(--primary);
        }

        .arrow-down.done {
            background: linear-gradient(to bottom, rgba(16, 185, 129, 0.3), var(--success));
        }

        .arrow-down.done::after {
            border-top-color: var(--success);
        }

        /* 水平箭头 */
        .arrow-right {
            display: flex;
            align-items: center;
            width: 35px;
        }

        .arrow-right::before {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, rgba(255,255,255,0.2), rgba(255,255,255,0.4));
        }

        .arrow-right::after {
            content: '';
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 6px solid rgba(255,255,255,0.4);
        }

        .arrow-right.active::before {
            background: linear-gradient(to right, rgba(0, 212, 255, 0.3), var(--primary));
        }

        .arrow-right.active::after {
            border-left-color: var(--primary);
        }

        /* 分组标签 */
        .group-label {
            position: absolute;
            left: -80px;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.7em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
        }

        /* 循环框 */
        .loop-box {
            border: 2px dashed rgba(168, 85, 247, 0.5);
            border-radius: 16px;
            padding: 15px 20px;
            position: relative;
            background: rgba(168, 85, 247, 0.05);
        }

        .loop-box .loop-tag {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-main);
            padding: 2px 10px;
            font-size: 0.75em;
            color: #a855f7;
            border-radius: 8px;
        }

        /* 控制面板 */
        .ctrl-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: var(--bg-card);
            border-radius: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(40, 40, 60, 0.8);
            border: 2px solid var(--border-color);
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .ctrl-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .ctrl-btn.play {
            width: 52px;
            height: 52px;
            font-size: 1.2em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        .ctrl-btn.play.playing {
            background: var(--warning);
        }

        .progress-box {
            flex: 1;
            max-width: 280px;
            min-width: 150px;
        }

        .progress-track {
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            color: #888;
            font-size: 0.75em;
            margin-top: 5px;
        }

        .speed-box {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 18px;
        }

        .speed-box span {
            color: #666;
            font-size: 0.8em;
        }

        .spd-btn {
            padding: 3px 8px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.8em;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .spd-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: 600;
        }

        /* 详情面板 */
        .info-panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }

        .info-title {
            flex: 1;
        }

        .info-title h3 {
            font-size: 1.15em;
            margin-bottom: 3px;
        }

        .info-title p {
            color: #888;
            font-size: 0.85em;
        }

        .info-metrics {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .metric-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-item label {
            display: block;
            color: #666;
            font-size: 0.65em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .metric-item span {
            color: var(--primary);
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 0.95em;
        }

        .info-body {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 14px 18px;
        }

        .info-body h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .info-body p {
            color: #aaa;
            line-height: 1.6;
            font-size: 0.9em;
        }

        .formula {
            background: rgba(255, 230, 109, 0.1);
            border: 1px solid rgba(255, 230, 109, 0.3);
            border-radius: 6px;
            padding: 8px 14px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
            text-align: center;
            font-size: 0.9em;
        }

        .anim-info {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 12px;
            display: none;
        }

        .anim-info.show {
            display: block;
        }

        .anim-info h5 {
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .anim-info p {
            color: #aaa;
            font-size: 0.85em;
        }

        .tokens-box {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(0, 212, 255, 0.15));
            border-radius: 8px;
            border: 1px solid var(--success);
            margin-top: 12px;
        }

        .tokens-box.show {
            display: flex;
        }

        .tokens-box .spin {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tokens-box .cnt {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--success);
            font-family: 'Courier New', monospace;
        }

        .tokens-box .tok {
            font-size: 1em;
            color: var(--accent);
            font-weight: 600;
        }

        .key-hints {
            text-align: center;
            color: #555;
            font-size: 0.75em;
            margin-top: 10px;
        }

        .key-hints kbd {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 0 2px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .group-label {
                display: none;
            }
            
            .step-box {
                min-width: 100px;
                padding: 10px 12px;
            }
            
            .step-box .name {
                font-size: 0.8em;
            }
            
            .mode-tab {
                padding: 8px 14px;
                font-size: 0.8em;
            }
        }

        @media (max-width: 600px) {
            .step-row {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .arrow-right {
                width: 20px;
            }
            
            .info-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

    <script>
        // ==================== 流程定义 ====================
        const FLOWS = {
            // 推理模式
            inference: {
                name: '推理模式',
                groups: [
                    {
                        label: '输入',
                        steps: [
                            { icon: '💬', name: '输入文本', dim: '文本', op: 'Prompt', param: '-', color: '#3b82f6',
                              desc: '用户输入自然语言 prompt',
                              detail: '用户输入问题或指令，如"今天天气怎么样？"' },
                            { icon: '📝', name: 'Tokenizer', dim: '[N]', op: 'BPE', param: 'vocab=6400', color: '#8b5cf6',
                              desc: '文本 → token 序列',
                              detail: '使用 BPE 分词将文本拆成子词单元',
                              formula: '["今天","天气"] → [128, 256]' },
                            { icon: '📊', name: 'Embedding', dim: '[N,768]', op: '查表', param: 'E∈R^{6400×768}', color: '#06b6d4',
                              desc: 'token ID → 向量',
                              detail: '通过 Embedding 矩阵映射到向量空间' },
                            { icon: '📍', name: 'RoPE', dim: '[N,768]', op: '旋转', param: 'θ=1e6', color: '#10b981',
                              desc: '注入位置信息',
                              detail: '旋转位置编码，使模型理解词序',
                              formula: 'x_rot = x·cos(θ) + x_rot·sin(θ)' }
                        ]
                    },
                    {
                        label: 'Transformer',
                        loop: true,
                        loopText: '×8 层',
                        steps: [
                            { icon: '🎯', name: 'Attention', dim: '[N,768]', op: 'Q·K^T·V', param: 'heads=8', color: '#f59e0b',
                              desc: '多头自注意力',
                              detail: '每个 token 关注序列中所有 token',
                              formula: 'Attention(Q,K,V) = softmax(QK^T/√d)V' },
                            { icon: '🔄', name: 'FFN', dim: '[N,768]', op: 'SwiGLU', param: 'hidden=2048', color: '#ec4899',
                              desc: '前馈网络',
                              detail: '升维 → SwiGLU 激活 → 降维',
                              formula: 'FFN(x) = (xW₁ ⊙ SiLU(xW₃))W₂' }
                        ]
                    },
                    {
                        label: '输出',
                        steps: [
                            { icon: '📈', name: 'LM Head', dim: '[N,V]', op: '投影', param: 'V=6400', color: '#ef4444',
                              desc: '投影到词表',
                              detail: '将隐藏状态投影到词表大小' },
                            { icon: '🎯', name: 'Softmax', dim: '[V]', op: '归一化', param: 'T=1.0', color: '#f97316',
                              desc: '转为概率分布',
                              detail: '将 logits 转为概率',
                              formula: 'P(x) = exp(x/T) / Σexp(xᵢ)' },
                            { icon: '🎲', name: 'Sampling', dim: '1', op: 'top-p', param: 'p=0.9', color: '#84cc16',
                              desc: '采样下一个词',
                              detail: '根据概率分布采样' }
                        ]
                    },
                    {
                        label: '循环',
                        steps: [
                            { icon: '➕', name: '追加序列', dim: '[N+1]', op: '拼接', param: '-', color: '#06b6d4',
                              desc: '将生成 token 加入',
                              detail: '自回归：新 token 加入输入序列' },
                            { icon: '🔍', name: '检查结束', dim: '-', op: '判断', param: 'max=512', color: '#f59e0b',
                              desc: '是否结束',
                              detail: '遇到 EOS 或达到最大长度则停止' },

        // ==================== 控制器 ====================
        class FlowController {
            constructor() {
                this.mode = 'inference';
                this.flow = FLOWS[this.mode];
                this.idx = -1;
                this.steps = [];
                this.playing = false;
                this.speed = 1;
                this.timers = [];
                this.generated = [];
                this.tokens = ['今', '天', '天', '气', '很', '好'];
                
                this.init();
            }

            init() {
                this.flattenSteps();
                this.render();
                this.bindEvents();
            }

            flattenSteps() {
                this.steps = [];
                this.flow.groups.forEach(g => {
                    g.steps.forEach(s => {
                        s.groupLabel = g.label;
                        s.inLoop = g.loop;
                    });
                    this.steps.push(...g.steps);
                });
            }

            render() {
                this.flow = FLOWS[this.mode];
                this.flattenSteps();
                this.idx = -1;
                this.generated = [];

                let html = '<div class="flow-container">';
                
                this.flow.groups.forEach((group, gi) => {
                    html += `<div class="step-row" style="position: relative;">`;
                    html += `<div class="group-label">${group.label}</div>`;
                    
                    if (group.loop) {
                        html += `<div class="loop-box">`;
                        html += `<div class="loop-tag">🔁 ${group.loopText}</div>`;
                    }
                    
                    group.steps.forEach((step, si) => {
                        const globalIdx = this.getGlobalIdx(gi, si);
                        
                        if (si > 0) {
                            html += `<div class="arrow-right" data-idx="${globalIdx - 1}"></div>`;
                        }
                        
                        html += `<div class="step-box" data-idx="${globalIdx}" style="border-color: ${step.color}50;">
                            <div class="icon">${step.icon}</div>
                            <div class="name">${step.name}</div>
                            <div class="dim">${step.dim}</div>
                        </div>`;
                    });
                    
                    if (group.loop) {
                        html += `</div>`;
                    }
                    
                    html += `</div>`;
                    
                    if (gi < this.flow.groups.length - 1) {
                        let prevSteps = 0;
                        for (let i = 0; i <= gi; i++) {
                            prevSteps += this.flow.groups[i].steps.length;
                        }
                        html += `<div class="arrow-down" data-idx="${prevSteps - 1}"></div>`;
                    }
                });
                
                html += '</div>';
                document.getElementById('vizPanel').innerHTML = html;
                
                this.updateUI();
                
                document.getElementById('tokensBox').classList.toggle('show', this.mode === 'inference');
            }

            getGlobalIdx(groupIdx, stepIdx) {
                let idx = 0;
                for (let i = 0; i < groupIdx; i++) {
                    idx += this.flow.groups[i].steps.length;
                }
                return idx + stepIdx;
            }

            bindEvents() {
                document.querySelectorAll('.mode-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        this.mode = tab.dataset.mode;
                        this.render();
                    });
                });

                document.getElementById('playBtn').addEventListener('click', () => {
                    this.playing ? this.pause() : this.play();
                });
                document.getElementById('prevBtn').addEventListener('click', () => { this.pause(); this.prev(); });
                document.getElementById('nextBtn').addEventListener('click', () => { this.pause(); this.next(); });
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());

                document.querySelectorAll('.spd-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.spd-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.speed = parseFloat(btn.dataset.speed);
                    });
                });

                document.getElementById('vizPanel').addEventListener('click', e => {
                    const box = e.target.closest('.step-box');
                    if (box) {
                        const idx = parseInt(box.dataset.idx);
                        this.pause();
                        this.goTo(idx);
                    }
                });

                document.addEventListener('keydown', e => {
                    if (e.key === ' ') { e.preventDefault(); this.playing ? this.pause() : this.play(); }
                    else if (e.key === 'ArrowLeft') { e.preventDefault(); this.pause(); this.prev(); }
                    else if (e.key === 'ArrowRight') { e.preventDefault(); this.pause(); this.next(); }
                    else if (e.key.toLowerCase() === 'r') { e.preventDefault(); this.reset(); }
                });
            }

            play() {
                if (this.playing) return;
                this.playing = true;
                document.getElementById('playBtn').textContent = '⏸';
                document.getElementById('playBtn').classList.add('playing');
                this.run();
            }

            pause() {
                this.playing = false;
                this.timers.forEach(t => clearTimeout(t));
                this.timers = [];
                document.getElementById('playBtn').textContent = '▶';
                document.getElementById('playBtn').classList.remove('playing');
            }

            reset() {
                this.pause();
                this.idx = -1;
                this.generated = [];
                this.updateUI();
                document.getElementById('animInfo').classList.remove('show');
                document.getElementById('tokCount').textContent = '0';
                document.getElementById('curTok').textContent = '-';
            }

            prev() {
                if (this.idx > 0) this.goTo(this.idx - 1);
            }

            next() {
                if (this.idx < this.steps.length - 1) this.goTo(this.idx + 1);
            }

            goTo(i) {
                this.idx = i;
                this.updateUI();
            }

            async run() {
                while (this.playing && this.idx < this.steps.length - 1) {
                    this.idx++;
                    this.updateUI();
                    await this.delay(this.getDelay());
                }

                if (this.mode === 'inference' && this.playing && this.idx >= this.steps.length - 1) {
                    const step = this.steps[this.idx];
                    if (step && step.name === '检查结束') {
                        if (this.generated.length < this.tokens.length) {
                            const tok = this.tokens[this.generated.length];
                            this.generated.push(tok);
                            document.getElementById('tokCount').textContent = this.generated.length;
                            document.getElementById('curTok').textContent = `"${tok}"`;
                            this.showAnim('✨ 生成 Token', `已生成第 ${this.generated.length} 个: "${tok}"`);
                            
                            await this.delay(400);
                            const attnIdx = this.steps.findIndex(s => s.name === 'Attention');
                            if (attnIdx >= 0) {
                                this.idx = attnIdx - 1;
                                this.updateUI();
                            }
                        } else {
                            this.showFinal();
                            this.pause();
                        }
                    }
                }

                if (this.mode !== 'inference' && this.playing && this.idx >= this.steps.length - 1) {
                    this.showAnim('🔄 训练迭代', '完成一轮，继续下一批次...');
                    await this.delay(500);
                    this.idx = -1;
                    this.updateUI();
                }
            }

            getDelay() {
                const step = this.steps[this.idx];
                if (step?.inLoop) return 700 / this.speed;
                return 450 / this.speed;
            }

            delay(ms) {
                return new Promise(resolve => {
                    const t = setTimeout(resolve, ms);
                    this.timers.push(t);
                });
            }

            updateUI() {
                document.querySelectorAll('.step-box').forEach(box => {
                    const i = parseInt(box.dataset.idx);
                    box.classList.remove('active', 'completed');
                    if (i < this.idx) box.classList.add('completed');
                    else if (i === this.idx) box.classList.add('active');
                });

                document.querySelectorAll('.arrow-down, .arrow-right').forEach(arr => {
                    const i = parseInt(arr.dataset.idx);
                    arr.classList.remove('active', 'done');
                    if (i < this.idx) arr.classList.add('done');
                    else if (i === this.idx) arr.classList.add('active');
                });

                const total = this.steps.length;
                const current = this.idx + 1;
                const pct = total > 0 ? (current / total) * 100 : 0;
                document.getElementById('progressBar').style.width = `${pct}%`;
                document.getElementById('progressText').textContent = `步骤 ${Math.max(0, current)} / ${total}`;

                document.getElementById('prevBtn').disabled = this.idx <= 0;
                document.getElementById('nextBtn').disabled = this.idx >= total - 1;

                const step = this.steps[this.idx];
                if (step) {
                    document.getElementById('infoIcon').textContent = step.icon;
                    document.getElementById('infoName').textContent = step.name;
                    document.getElementById('infoDesc').textContent = step.desc;
                    document.getElementById('metricDim').textContent = step.dim;
                    document.getElementById('metricOp').textContent = step.op;
                    document.getElementById('metricParam').textContent = step.param;

                    let html = step.detail;
                    if (step.formula) {
                        html += `<div class="formula">${step.formula}</div>`;
                    }
                    document.getElementById('infoText').innerHTML = html;
                } else {
                    document.getElementById('infoIcon').textContent = '💡';
                    document.getElementById('infoName').textContent = '选择模式开始';
                    document.getElementById('infoDesc').textContent = '点击播放按钮开始';
                    document.getElementById('metricDim').textContent = '-';
                    document.getElementById('metricOp').textContent = '-';
                    document.getElementById('metricParam').textContent = '-';
                    document.getElementById('infoText').textContent = '选择模式后点击播放按钮。';
                }
            }

            showAnim(title, text) {
                document.getElementById('animTitle').textContent = title;
                document.getElementById('animText').textContent = text;
                document.getElementById('animInfo').classList.add('show');
            }

            showFinal() {
                const text = this.generated.join('');
                document.getElementById('infoText').innerHTML = `
                    <h4>🎉 生成完成</h4>
                    <p>输出: <strong style="color: var(--success); font-size: 1.1em;">"${text}"</strong></p>
                    <p style="margin-top: 10px;">共 <span style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #000; padding: 2px 10px; border-radius: 4px; font-weight: bold;">${this.generated.length}</span> 个 token</p>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.ctrl = new FlowController();
        });
    </script>
</body>
</html>
